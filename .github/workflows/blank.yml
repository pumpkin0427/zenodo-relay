name: Download MADGEN assets
on:
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download data files
        run: |
          mkdir -p madgen_assets
          curl -L -o madgen_assets/msgym.pkl "https://zenodo.org/records/15036069/files/msgym.pkl?download=1"
          curl -L -o madgen_assets/canopus.pkl "https://zenodo.org/records/15036069/files/canopus.pkl?download=1"
      - name: List and download checkpoint files
        run: |
          curl -s "https://zenodo.org/api/records/17115068" | jq -r '.files[] | "\(.key) \(.links.self)"' > filelist.txt
          cat filelist.txt
          while read -r key url; do
            curl -L -o "madgen_assets/$key" "$url"
          done < filelist.txt
          ls -lh madgen_assets/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: madgen-assets
          files: madgen_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
